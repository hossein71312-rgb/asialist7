name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms android --org ir.asia --project-name asia_prices .
      - name: Prepare signing key (if secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/asia-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=asia\nstoreFile=asia-release.jks\n' "$KS_PASS" "$KS_PASS" > android/key.properties
          fi
      - run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --build-name=1.1.0 --build-number=${{ github.run_number }} --target-platform android-arm,android-arm64 --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: asia-prices-apk
          path: build/app/outputs/flutter-apk/app-release.apk
